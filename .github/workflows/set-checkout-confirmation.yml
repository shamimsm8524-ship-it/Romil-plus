name: Set checkout confirmation text

on:
  push:
    paths:
      - '.github/workflows/set-checkout-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update confirmation text
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/checkout/page.tsx')
          s=p.read_text()
          s=s.replace('✓ Comprobante enviado · en revisión','✅ Comprobante enviado correctamente',1)
          s=s.replace('Pedido {orderId.slice(0,8).toUpperCase()} recibido correctamente. Los productos ya fueron retirados de tu carrito.','Tu pago está en revisión.',1)
          p.write_text(s)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/checkout/page.tsx
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "Improve payment receipt confirmation"
            git push origin main
          fi
