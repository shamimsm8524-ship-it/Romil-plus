name: Install order payment receipts

on:
  push:
    paths:
      - '.github/workflows/install-order-receipts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch checkout and admin
        shell: python
        run: |
          from pathlib import Path

          checkout = Path('app/checkout/page.tsx')
          s = checkout.read_text()

          marker = '  const [buyerEmail,setBuyerEmail]=useState("");\n'
          addition = marker + '  const [receipt,setReceipt]=useState<File|null>(null);\n  const [payerName,setPayerName]=useState("");\n  const [draftOrderId,setDraftOrderId]=useState("");\n'
          if 'const [receipt,setReceipt]' not in s:
              if marker not in s: raise SystemExit('checkout state marker not found')
              s = s.replace(marker, addition, 1)

          start = s.index('  const reportPayment=async()=>')
          end = s.index('\n\n  if(checkingAuth)', start)
          new_fn = '''  const reportPayment=async()=>{
    if(!supabase||items.length===0||paymentReported||savingOrder)return;
    if(!receipt){setSaveError("Adjunta el comprobante de pago antes de enviarlo.");return;}
    if(receipt.size>5*1024*1024){setSaveError("El comprobante supera el máximo de 5 MB.");return;}
    setSavingOrder(true);setSaveError("");
    try{
      const{data:sessionData}=await supabase.auth.getSession();
      const user=sessionData.session?.user;
      if(!user){window.location.replace("/login?next=%2Fcheckout");return;}
      const purchasedItems=[...items];
      const purchasedTotal=total;
      let currentOrderId=draftOrderId;
      if(!currentOrderId){
        currentOrderId=crypto.randomUUID();
        const{error:orderError}=await supabase.from("orders").insert({id:currentOrderId,user_id:user.id,customer_email:user.email||null,total:purchasedTotal,payment_method:method});
        if(orderError)throw orderError;
        const orderItems=purchasedItems.map(item=>({order_id:currentOrderId,product_name:`${item.name} — ${item.duration}`,unit_price:item.price,quantity:1}));
        const{error:itemsError}=await supabase.from("order_items").insert(orderItems);
        if(itemsError)throw itemsError;
        setDraftOrderId(currentOrderId);
      }
      const safeName=String(receipt.name||"comprobante").replace(/[^a-zA-Z0-9._-]/g,"_").slice(-90);
      const path=`${user.id}/${currentOrderId}/${Date.now()}-${safeName}`;
      const{error:uploadError}=await supabase.storage.from("order-receipts").upload(path,receipt,{contentType:receipt.type||"application/octet-stream",upsert:false});
      if(uploadError)throw uploadError;
      const{error:receiptError}=await supabase.rpc("submit_order_receipt",{p_order_id:currentOrderId,p_receipt_path:path,p_payer_name:payerName.trim()||null});
      if(receiptError)throw receiptError;
      setSubmittedItems(purchasedItems);setSubmittedTotal(purchasedTotal);setBuyerEmail(user.email||"");setOrderId(currentOrderId);setPaymentReported(true);setDraftOrderId("");clear();
    }catch(err){
      console.error(err);const problem=err as SupabaseLikeError;const code=problem.code?` (${problem.code})`:"";setSaveError(`Error${code}: ${problem.message||"No se pudo enviar el comprobante"}`);
    }finally{setSavingOrder(false);}
  };'''
          s = s[:start] + new_fn + s[end:]

          old_button = '{!paymentReported?<button type="button" onClick={reportPayment} disabled={items.length===0||savingOrder} className="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-[#e3b64f] px-4 py-3 font-black text-black disabled:opacity-40"><Check size={19}/>{savingOrder?"Guardando pedido...":"Ya realicé el pago"}</button>:'
          new_button = '{!paymentReported&&<div className="mt-6 space-y-3"><div className="rounded-2xl border border-white/10 bg-black/20 p-4"><label className="block text-xs font-black uppercase tracking-wider text-[#e3b64f]">Comprobante de pago</label><input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" onChange={e=>{setReceipt(e.target.files?.[0]||null);setSaveError("");}} className="mt-3 block w-full text-sm text-white/70 file:mr-3 file:rounded-lg file:border-0 file:bg-white file:px-3 file:py-2 file:font-bold file:text-black"/><p className="mt-2 text-xs text-white/40">{receipt?`${receipt.name} · ${Math.ceil(receipt.size/1024)} KB`:"Adjunta imagen o PDF (máx. 5 MB)."}</p></div><input value={payerName} onChange={e=>setPayerName(e.target.value)} placeholder="Nombre de quien realizó el pago (opcional)" className="w-full rounded-xl border border-white/10 bg-black/30 px-4 py-3"/><p className="text-xs text-white/45">El comprobante quedará asociado automáticamente a tu correo: <b className="text-white/70">{buyerEmail}</b></p></div>}{!paymentReported?<button type="button" onClick={reportPayment} disabled={items.length===0||savingOrder||!receipt} className="mt-4 flex w-full items-center justify-center gap-2 rounded-xl bg-[#e3b64f] px-4 py-3 font-black text-black disabled:opacity-40"><Check size={19}/>{savingOrder?"Enviando comprobante...":"Enviar comprobante"}</button>:'
          if old_button not in s: raise SystemExit('checkout button marker not found')
          s = s.replace(old_button, new_button, 1)
          s = s.replace('disabled={paymentReported||savingOrder}', 'disabled={paymentReported||savingOrder||!!draftOrderId}')
          s = s.replace('<p className="mt-2 font-black">Pago pendiente de verificación</p><p className="mt-1 text-xs">Pedido {orderId.slice(0,8).toUpperCase()} guardado. Los productos ya fueron retirados de tu carrito.</p>', '<p className="mt-2 font-black">✓ Comprobante enviado · en revisión</p><p className="mt-1 text-xs">Pedido {orderId.slice(0,8).toUpperCase()} enviado desde {buyerEmail}. Los productos ya fueron retirados de tu carrito.</p>')
          checkout.write_text(s)

          admin = Path('app/admin/page.tsx')
          a = admin.read_text()
          old_type = 'type Order={id:string;user_id:string;customer_email:string|null;status:string;total:number;payment_method:string|null;created_at:string;order_items:OrderItem[]};'
          new_type = 'type Order={id:string;user_id:string;customer_email:string|null;status:string;total:number;payment_method:string|null;created_at:string;receipt_path:string|null;receipt_payer_name:string|null;receipt_uploaded_at:string|null;order_items:OrderItem[]};'
          if old_type in a: a = a.replace(old_type,new_type,1)
          elif 'receipt_path:string|null' not in a: raise SystemExit('admin Order type marker not found')

          old_select = '.select("id,user_id,customer_email,status,total,payment_method,created_at")'
          new_select = '.select("id,user_id,customer_email,status,total,payment_method,created_at,receipt_path,receipt_payer_name,receipt_uploaded_at")'
          if old_select in a: a = a.replace(old_select,new_select,1)
          elif 'receipt_uploaded_at' not in a: raise SystemExit('admin select marker not found')

          effect = ' useEffect(()=>{load();},[]);\n'
          receipt_fn = effect + ' const openReceipt=async(order:Order)=>{clickSound();if(!supabase||!order.receipt_path)return;const w=window.open("","_blank");try{const{data,error}=await supabase.storage.from("order-receipts").createSignedUrl(order.receipt_path,300);if(error)throw error;if(w)w.location=data.signedUrl;else window.location.href=data.signedUrl;}catch(err){console.error(err);if(w)w.close();setFeedback(p=>({...p,[order.id]:"❌ No se pudo abrir el comprobante."}));}};\n'
          if 'const openReceipt=async' not in a:
              if effect not in a: raise SystemExit('admin effect marker not found')
              a = a.replace(effect,receipt_fn,1)

          ui_marker = '</p></div><p className="mt-4 text-sm">Estado:'
          receipt_ui = '</p></div><div className="mt-3 rounded-xl border border-violet-400/20 bg-violet-400/[0.06] p-3"><p className="text-xs font-bold uppercase text-violet-300">Comprobante de pago</p>{o.receipt_path?<><p className="mt-1 break-all text-sm"><b>Enviado por:</b> {o.customer_email||"Correo no registrado"}</p><p className="mt-1 text-xs text-white/45"><b>Pagador:</b> {o.receipt_payer_name||"No indicado"}{o.receipt_uploaded_at?` · ${new Date(o.receipt_uploaded_at).toLocaleString("es-PE")}`:""}</p><button type="button" onClick={()=>openReceipt(o)} className="mt-3 rounded-xl bg-violet-500 px-4 py-2 text-sm font-black text-white">👁 Ver comprobante</button></>:<p className="mt-1 text-sm text-white/45">Aún no se adjuntó comprobante.</p>}</div><p className="mt-4 text-sm">Estado:'
          if receipt_ui not in a:
              if ui_marker not in a: raise SystemExit('admin UI marker not found')
              a = a.replace(ui_marker,receipt_ui,1)
          admin.write_text(a)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/checkout/page.tsx app/admin/page.tsx
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "Add customer payment receipt uploads"
            git push origin main
          fi
