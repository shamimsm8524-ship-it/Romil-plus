name: Refrescar convocatorias SUNAT

on:
  schedule:
    # 05:02 a 14:57 hora de Perú (UTC-5), cada 5 minutos.
    # El pequeño desfase evita depender del minuto exacto de cambio de hora.
    - cron: "2-57/5 10-19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-sunat-romilplus
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Activar actualización de la página de convocatorias
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.romilplus.me/convocatorias"

          # La primera petición activa la revalidación cuando el caché ya venció.
          curl --fail --silent --show-error --location \
            --max-time 30 --retry 2 --retry-delay 2 \
            -H "User-Agent: ROMIL-PLUS-SUNAT-REFRESH/1.0" \
            "$URL" >/dev/null

          # Una segunda lectura deja disponible la versión regenerada para visitantes.
          sleep 4
          curl --fail --silent --show-error --location \
            --max-time 30 --retry 2 --retry-delay 2 \
            -H "User-Agent: ROMIL-PLUS-SUNAT-REFRESH/1.0" \
            "$URL" >/dev/null
