      <text x="135" y="170" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="900" fill="#fff">A</text>
      <text x="135" y="225" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#fff" opacity=".9">AutoCAD</text>
    </g>
