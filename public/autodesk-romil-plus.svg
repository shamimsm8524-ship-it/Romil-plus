      <text x="125" y="160" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="96" font-weight="900" fill="#fff">R</text>
      <text x="125" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#fff" opacity=".9">Revit</text>
    </g>
    <g transform="translate(565 260) rotate(-3 130 130)">
