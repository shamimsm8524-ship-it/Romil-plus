<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">AUTODESK</title>
  <desc id="desc">Autodesk product artwork for ROMIL PLUS</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#101b2f"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#49d6ff"/><stop offset="1" stop-color="#1268ff"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8e6cff"/><stop offset="1" stop-color="#4d25dc"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb14a"/><stop offset="1" stop-color="#ff5a36"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67f1a4"/><stop offset="1" stop-color="#08a86e"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1200" height="800" rx="56" fill="url(#bg)"/>
  <circle cx="980" cy="130" r="240" fill="#2c75ff" opacity=".08"/>
  <circle cx="165" cy="705" r="240" fill="#8d5dff" opacity=".08"/>
  <g opacity=".16" stroke="#89a7cf" stroke-width="1">
